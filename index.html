  .panel-2 { background: var(--panel-2); border: 1px solid var(--border); }
  .chip { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:9999px; font-size:11px; font-weight:600; border:1px solid var(--border); background:#111a2e; color: var(--muted); }
  .chip-good { color:#0b1220; background: var(--good); border-color: var(--good); }

  .chip-indigo { color:#0b1220; background: var(--accent-2); border-color: var(--accent-2); }
  .chip-warn { color:#0b1220; background: var(--warn); border-color: var(--warn); }
  .input, .select { background:#0b1220; border:1px solid var(--border); color: var(--text); border-radius:8px; padding:8px 10px; font-size:13px; width:100%; }
  .input:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(94,234,212,.15); }
  .btn { background: var(--accent); color:#0b1220; font-weight:600; border-radius:8px; padding:8px 12px; font-size:13px; }
  .btn:hover { filter: brightness(1.05); }
  .btn-ghost { background: transparent; color: var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:13px; }
  .btn-ghost:hover { background: var(--panel-2); }
  .site-card { transition: transform .12s ease, border-color .12s ease; }
  .site-card:hover { transform: translateY(-1px); border-color: var(--accent); cursor: pointer; }
  .map-bg { background:
    radial-gradient(circle at 20% 30%, rgba(94,234,212,.10), transparent 40%),
    radial-gradient(circle at 70% 60%, rgba(129,140,248,.10), transparent 40%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 40px),
    #0b1220;
  }
  .scrollbar::-webkit-scrollbar { width: 8px; }
  .scrollbar::-webkit-scrollbar-thumb { background: #243150; border-radius: 8px; }
  .pin { position:absolute; transform: translate(-50%, -50%); }
  .pin-dot { width:14px; height:14px; border-radius:50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(94,234,212,.25); border:2px solid #0b1220; cursor:pointer; }
  .pin-dot.active { background: var(--accent-2); box-shadow: 0 0 0 6px rgba(129,140,248,.3); }
  .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; background:#0b1220; border:1px solid var(--border); padding: 1px 6px; border-radius:4px; color: var(--muted); }
  .divider { height:1px; background: var(--border); }
  .num { font-variant-numeric: tabular-nums; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .grow-input { background: transparent; border: none; color: var(--text); width: 90px; text-align:right; font-variant-numeric: tabular-nums; }
  .grow-input:focus { outline: none; }
  .slider { -webkit-appearance:none; appearance:none; width:100%; height:4px; background: var(--border); border-radius:4px; }
  .slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%; background: var(--accent); cursor:pointer; }
  .bar { background: var(--panel-2); height: 8px; border-radius: 9999px; overflow:hidden; }
  .bar > span { display:block; height:100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

// -------------------- HELPERS --------------------
const fmt$ = n => n == null ? "—" : "$" + Math.round(n).toLocaleString();
const fmt$k = n => n == null ? "—" : "$" + Math.round(n/1000).toLocaleString() + "k";
const fmt$m = n => n == null ? "—" : "$" + (n/1e6).toFixed(2) + "M";
const fmtNum = n => n == null ? "—" : Math.round(n).toLocaleString();
const fmtPct = n => n == null ? "—" : (n*100).toFixed(2) + "%";
const fmtSF = n => fmtNum(n) + " SF";
const acres = sf => (sf / 43560).toFixed(2);

function getPF(site) {
  return { ...site.proforma, ...(state.pfOverride[site.id] || {}) };
}

function computePF(site) {
  const pf = getPF(site);
  const buildableSF = pf.units * pf.avgUnitSF * 1.18; // 18% loss factor for circ/common
  const hardCost = buildableSF * pf.hardCostSF;
  const softCostPct = 0.22;
  const softCost = hardCost * softCostPct;
  const landCost = site.askPrice;
  const contingency = (hardCost + softCost) * 0.05;
  const tdc = landCost + hardCost + softCost + contingency;
  const costPerUnit = tdc / pf.units;
  const annualRentRestricted = pf.monthlyRentRestricted * pf.units * 12;
  const opex = annualRentRestricted * 0.42; // OpEx ratio
  const noi = annualRentRestricted * (1 - 0.42) - (pf.units * 250); // less reserves
  const yieldOnCost = noi / tdc;
  // LIHTC eligible basis: roughly TDC minus land minus non-residential
  const eligibleBasis = (hardCost + softCost + contingency) * 0.95;
  const basisBoost = (site.incentiveFlags.qct || site.incentiveFlags.dda) ? 1.30 : 1.0;
  const adjustedBasis = eligibleBasis * basisBoost;
  const lihtcRate = site.incentives.some(i => i.includes("9%")) ? 0.09 : 0.04;
  const annualCredits = adjustedBasis * lihtcRate;
  const tenYrCredits = annualCredits * 10;
  const equityPrice = 0.92;
  const lihtcEquity = tenYrCredits * equityPrice;
  // Funding gap
  const debtCoverage = noi / 1.20 / 0.065; // 1.20 DSCR @ 6.5% constant
  const permLoan = Math.min(debtCoverage, tdc * 0.55);
  const softLoans = tdc * 0.08;
  const gpEquity = Math.max(0, tdc - lihtcEquity - permLoan - softLoans);
  return {
    buildableSF, hardCost, softCost, landCost, contingency, tdc, costPerUnit,
    annualRentRestricted, opex, noi, yieldOnCost,
    eligibleBasis, adjustedBasis, lihtcRate, annualCredits, tenYrCredits, lihtcEquity,
    permLoan, softLoans, gpEquity, basisBoost
  };
}

function filteredSites() {
  const q = state.query.trim().toLowerCase();
  return SITES.filter(s => {
    if (q) {
      const hay = [s.zip, s.city, s.state, s.county, s.addr].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    const f = state.filters;
    if (f.lihtc && !s.incentiveFlags.lihtc) return false;
    if (f.oz && !s.incentiveFlags.oz) return false;
    if (f.densityBonus && !s.incentiveFlags.densityBonus) return false;
    if (f.inclusionary && !s.incentiveFlags.inclusionary) return false;
    if (f.qct && !s.incentiveFlags.qct) return false;
    if (f.dda && !s.incentiveFlags.dda) return false;
    if (f.tod && !s.incentiveFlags.tod) return false;
    if (f.hudHome && !s.incentiveFlags.hudHome) return false;
    if (f.liveLocal && !s.incentiveFlags.liveLocal) return false;
    if (f.surtax && !s.incentiveFlags.surtax) return false;
    if (f.excludeFloodAE && s.incentiveFlags.floodAE) return false;
    if (s.askPrice > f.maxPrice) return false;
    if (s.lotSF < f.minLotSF) return false;
    if (f.constructionType !== "any") {
      const has = s.constructionTypes.some(c => c.toLowerCase().includes(f.constructionType.toLowerCase()));
      if (!has) return false;
    }
    return true;
  });
}

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

function setFilter(key, val) {
  state.filters = { ...state.filters, [key]: val };
  render();
}

function setPF(siteId, key, val) {
  state.pfOverride[siteId] = { ...(state.pfOverride[siteId] || {}), [key]: val };
  render();
}

function resetPF(siteId) {
  delete state.pfOverride[siteId];
  render();
}

                  </div>
                  <div>
                    <div class="flex justify-between"><span>GP equity / funding gap</span><span class="num" style="color:${pf.gpEquity>pf.tdc*0.1?'var(--warn)':'var(--good)'}">${fmt$(pf.gpEquity)}</span></div>
                    <div class="bar mt-1"><span style="width:${(fundingPct.gp*100).toFixed(1)}%"></span></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="divider"></div>

            <!-- Returns -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div>
                <div class="text-[11px]" style="color:var(--muted)">Gross Rent (restricted)</div>
                <div class="num font-semibold">${fmt$(pf.annualRentRestricted)}<span class="text-[11px] font-normal" style="color:var(--muted)"> /yr</span></div>
              </div>
              <div>
                <div class="text-[11px]" style="color:var(--muted)">NOI (yr 1 stabilized)</div>
                <div class="num font-semibold">${fmt$(pf.noi)}</div>
              </div>
              <div>
                <div class="text-[11px]" style="color:var(--muted)">Yield-on-Cost</div>
                <div class="num font-semibold" style="color:${pf.yieldOnCost>=0.06?'var(--good)':pf.yieldOnCost>=0.045?'var(--warn)':'var(--danger)'}">${fmtPct(pf.yieldOnCost)}</div>
              </div>
              <div>
                <div class="text-[11px]" style="color:var(--muted)">10-yr LIHTC Credits</div>
                <div class="num font-semibold">${fmt$(pf.tenYrCredits)}</div>
              </div>
            </div>

            <div class="text-[11px]" style="color:var(--muted)">
              <strong>Method:</strong> Buildable GSF = units × avg unit SF × 1.18 (loss factor). TDC = land + hard + 22% soft + 5% contingency.
              Restricted rent at ${inputs.amiTarget}% AMI assumed for stabilized year. Perm loan sized to lesser of 1.20 DSCR @ 6.5% or 55% LTC.
              LIHTC equity = 10-yr credits × $0.92/credit. Numbers are sketch-level — confirm against state QAP, local fee schedules, and current GC pricing.
            </div>
          </div>
        </section>
      </div>
    </div>
  `;
}

// -------------------- ROOT --------------------
function render() {
  const sites = filteredSites();
  const selected = SITES.find(s => s.id === state.selectedId) || null;
  document.getElementById("app").innerHTML = `
    ${Header()}
    <main class="max-w-[1400px] mx-auto px-6 py-4 grid grid-cols-12 gap-4">
      <div class="col-span-12 lg:col-span-3">${Sidebar()}</div>
      <div class="col-span-12 lg:col-span-9 space-y-4">
        ${Map(sites)}
        ${selected ? Detail(selected) : Results(sites)}
        ${selected ? `<div class="text-xs text-center" style="color:var(--muted)">— Back to all matches —</div>${Results(sites)}` : ""}
      </div>
    </main>
    <footer class="max-w-[1400px] mx-auto px-6 py-6 text-[11px]" style="color:var(--muted)">
      ParcelPath prototype · Mock data for 10 representative Miami-Dade sites · Production version would pull parcels from Miami-Dade Property Appraiser + Regrid,
      Miami 21 zoning from the City of Miami GIS, QCT/DDA from HUD, OZ from CDFI Fund, FEMA flood layers, and rents from HUD FMR + CoStar. Live Local Act preemption analysis would
      cross-reference highest-allowed density/height within a 1-mile radius. Pro-forma logic is intentionally simple — first-pass screening, not investment-committee material.
      Hurricane-code (FBC HVHZ) construction premiums are baked into hard-cost assumptions.
    </footer>
  `;
}

// Expose helpers globally for inline event handlers
window.setState = setState;
window.setFilter = setFilter;
window.setPF = setPF;
window.resetPF = resetPF;
window.render = render;

// Initial render
render();
</script>
</body>
</html>
