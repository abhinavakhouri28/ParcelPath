<style>
  :root {
    --bg-0: #070b16;
    --bg-1: #0b1124;
    --bg-2: #111933;
    --panel:  #131c38;
    --panel-2:#1a2548;
    --border: #243160;
    --border-soft: #1d2750;
    --text:   #ecf0fb;
    --text-2: #c2cae0;
    --muted:  #7a87ab;
    --muted-2:#5d6c92;
    --teal:   #5eead4;
    --teal-2: #2dd4bf;
    --aqua:   #67e8f9;
    --indigo: #818cf8;
    --coral:  #fb923c;
    --rose:   #fb7185;
    --amber:  #fbbf24;
    --good:   #34d399;
    --danger: #f87171;
    --gold:   #d4a574;
  }
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html, body {
    background: var(--bg-0);
    color: var(--text);
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-feature-settings: "cv02","cv03","cv04","cv11";
    letter-spacing: -0.005em;
  }
  body {
    background:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(94,234,212,0.08), transparent 60%),
      radial-gradient(ellipse 70% 50% at 80% -10%, rgba(251,146,60,0.06), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(129,140,248,0.05), transparent 60%),
      var(--bg-0);
    min-height: 100vh;
  }
  .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -0.02em; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  .panel {
    background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent), var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
  }
  .panel-2 {
    background: var(--panel-2);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
  }
  .panel-glass {
    background: linear-gradient(180deg, rgba(20,28,55,0.92), rgba(11,17,36,0.92));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-soft);
  }
  .divider { height:1px; background: var(--border-soft); }

  .chip { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:9999px; font-size:11px; font-weight:600; border:1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--text-2); letter-spacing: 0.01em; }
  .chip-teal   { color:#062a26; background: linear-gradient(135deg, #5eead4, #2dd4bf); border-color: transparent; }
  .chip-good   { color:#053428; background: linear-gradient(135deg, #34d399, #10b981); border-color: transparent; }
  .chip-indigo { color:#1a1640; background: linear-gradient(135deg, #a5b4fc, #818cf8); border-color: transparent; }
  .chip-amber  { color:#3b2a08; background: linear-gradient(135deg, #fde68a, #fbbf24); border-color: transparent; }
  .chip-coral  { color:#3a1c08; background: linear-gradient(135deg, #fdba74, #fb923c); border-color: transparent; }
  .chip-warn   { color: var(--amber); border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.06); }
  .chip-danger { color: var(--danger); border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.06); }

  .input, .select {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border-soft);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
    width: 100%;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .input:focus, .select:focus {
    outline: none;
    border-color: var(--teal);
    background: rgba(94,234,212,0.04);
    box-shadow: 0 0 0 3px rgba(94,234,212,0.12);
  }
  .input::placeholder { color: var(--muted-2); }

  .btn {
    background: linear-gradient(135deg, var(--teal), var(--teal-2));
    color: #062a26;
    font-weight: 600;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    transition: filter .12s ease, transform .12s ease;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-0.5px); }
  .btn-ghost {
    background: rgba(255,255,255,0.02);
    color: var(--text);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    transition: border-color .12s ease, background .12s ease;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.05); border-color: var(--border); }
  .btn-icon {
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border-soft);
    color: var(--text-2);
    transition: background .12s ease, color .12s ease;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.06); color: var(--text); }

  .slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px;
    background: var(--border-soft); border-radius: 4px;
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: linear-gradient(135deg, var(--teal), var(--teal-2));
    border: 2px solid var(--bg-1);
    box-shadow: 0 2px 8px rgba(94,234,212,0.35);
    cursor: pointer;
  }
  .slider::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--teal); border: 2px solid var(--bg-1); cursor: pointer;
  }

  .bar { background: rgba(255,255,255,0.04); height: 8px; border-radius: 9999px; overflow: hidden; display:flex; }
  .bar > span { display: block; height: 100%; }

  .site-card {
    transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .site-card::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at top right, rgba(94,234,212,0.06), transparent 50%);
    opacity: 0; transition: opacity .2s ease;
    pointer-events: none;
  }
  .site-card:hover::before { opacity: 1; }
  .site-card:hover { transform: translateY(-2px); border-color: var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .site-card.active {
    border-color: var(--teal) !important;
    box-shadow: 0 0 0 1px var(--teal), 0 8px 24px rgba(94,234,212,0.18);
  }
  .site-card.active::before { opacity: 1; }

  .map-container { position: relative; }
  .map-pin { cursor: pointer; transition: transform .15s ease; }
  .map-pin:hover { transform: scale(1.15); transform-origin: center; }
  .map-pin .pin-ring { animation: pulse 2.4s ease-out infinite; transform-origin: center; }
  @keyframes pulse {
    0%   { r: 6;  opacity: 0.55; }
    100% { r: 16; opacity: 0; }
  }

  .tooltip {
    position: absolute; pointer-events: none;
    background: rgba(7,11,22,0.96);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px; border-radius: 8px;
    font-size: 11px; line-height: 1.45;
    transform: translate(-50%, -115%);
    white-space: nowrap;
    box-shadow: 0 12px 24px rgba(0,0,0,0.5);
    z-index: 10;
  }

  .scrollbar::-webkit-scrollbar { width: 8px; }
  .scrollbar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  .scrollbar::-webkit-scrollbar-track { background: transparent; }

  .dotgrid {
    background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 16px 16px;
  }

  .h-section { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: var(--text); margin-bottom: 10px; }
  .h-section .icon { color: var(--teal); display: inline-flex; }
  .label-eyebrow { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  .stat-tile {
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--panel-2);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 12px;
  }
  .stat-tile .stat-num { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; font-family: 'Space Grotesk', 'Inter', sans-serif; }

  .nice-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
  .nice-table th { text-align: left; padding: 9px 12px; color: var(--muted); font-weight: 500; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 1px solid var(--border-soft); }
  .nice-table td { padding: 11px 12px; border-bottom: 1px solid var(--border-soft); }
  .nice-table tr:last-child td { border-bottom: none; }

  .gauge-track { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 10; stroke-linecap: round; }

  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px 4px 11px; border-radius: 9999px;
    background: rgba(94,234,212,0.10);
    border: 1px solid rgba(94,234,212,0.25);
    color: var(--teal);
    font-size: 11.5px; font-weight: 600;
  }
  .filter-chip button {
    width: 14px; height: 14px; border-radius: 9999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(94,234,212,0.15);
    color: var(--teal);
    font-size: 10px;
    line-height: 1;
    transition: background .12s ease;
  }
  .filter-chip button:hover { background: rgba(94,234,212,0.3); color: white; }

  .fade-in { animation: fadeIn .2s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(2px);} to { opacity: 1; transform:none; } }

  .pf-input-group { display: flex; flex-direction: column; gap: 4px; }
  .pf-input-group label { font-size: 11px; color: var(--muted); font-weight: 500; }

  .cbox {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px;
    border: 1.5px solid var(--border);
    background: rgba(255,255,255,0.02);
    border-radius: 5px;
    cursor: pointer;
    position: relative;
    transition: border-color .12s ease, background .12s ease;
    flex-shrink: 0;
  }
  .cbox:hover { border-color: var(--teal); }
  .cbox:checked {
    background: linear-gradient(135deg, var(--teal), var(--teal-2));
    border-color: var(--teal);
  }
  .cbox:checked::after {
    content: ""; position: absolute;
    left: 4px; top: 0.5px;
    width: 5px; height: 9px;
    border: solid #062a26;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 12.5px; }
  .kv .k { color: var(--muted); }
  .kv .v { color: var(--text-2); font-variant-numeric: tabular-nums; }

  .accent-text { background: linear-gradient(135deg, var(--teal), var(--aqua)); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>

// Confirmed public ArcGIS endpoints (no API key required).
const GIS = {
  zoning: "https://gis.miamigov.com/gis/rest/services/Zoning/ZoningMiami21/MapServer/5",
  flood:  "https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28",
};
const LIVE = { mode: "sample", ok: 0 }; // 'sample' | 'loading' | 'live'

function storiesToFeet(v) {
  if (v == null) return null;
  const n = parseFloat(String(v));
  if (isNaN(n)) return null;
  return /stor/i.test(String(v)) ? Math.round(n * 11) : n;
}
async function queryPoint(layer, lng, lat, outFields) {
  const p = new URLSearchParams({
    geometry: lng + "," + lat, geometryType: "esriGeometryPoint", inSR: "4326",
    spatialRel: "esriSpatialRelIntersects", outFields, returnGeometry: "false", f: "json",
  });
  const res = await fetch(layer + "/query?" + p.toString());
  if (!res.ok) throw new Error("http " + res.status);
  const j = await res.json();
  if (j.error) throw new Error(j.error.message || "arcgis error");
  return (j.features && j.features[0] && j.features[0].attributes) || null;
}
async function enrichOne(site) {
  const ll = SITE_LATLNG[site.id];
  if (!ll) return false;
  const lat = ll[0], lng = ll[1];
  let any = false;
  try {
    const z = await queryPoint(GIS.zoning, lng, lat, "TRANSECT,TRANSECT_DESC,BLDG_HEIGHT,INTENSITY");
    const code = z && (z.TRANSECT || z.Transect);
    if (code) {
      site.zoning.code = code;
      const desc = z.TRANSECT_DESC || z.Transect_Desc; if (desc) site.zoning.name = desc;
      const h = storiesToFeet(z.BLDG_HEIGHT != null ? z.BLDG_HEIGHT : z.Bldg_Height); if (h) site.zoning.maxHeight = h;
      const far = z.INTENSITY != null ? z.INTENSITY : (z.Intensity != null ? z.Intensity : z.FLR);
      if (far != null && !isNaN(parseFloat(far))) site.zoning.far = parseFloat(far);
      site._liveZoning = true; any = true;
    }
  } catch (e) { /* keep baked zoning */ }
  try {
    const f = await queryPoint(GIS.flood, lng, lat, "FLD_ZONE,SFHA_TF");
    if (f && f.FLD_ZONE) {
      site._floodZone = f.FLD_ZONE;
      site.incentiveFlags.floodAE = (f.SFHA_TF === "T") || /^(A|AE|AH|AO|AR|V|VE)$/i.test(f.FLD_ZONE);
      site._liveFlood = true; any = true;
    }
  } catch (e) { /* keep baked flood */ }
  return any;
}
async function enrichFromLiveGIS() {
  LIVE.mode = "loading"; render();
  let ok = 0;
  for (const s of SITES) {
    try { if (await enrichOne(s)) ok++; } catch (e) {}
  }
  LIVE.ok = ok;
  LIVE.mode = ok > 0 ? "live" : "sample";
  render();
}
function liveBadge() {
  if (LIVE.mode === "loading")
    return '<span style="width:5px;height:5px;border-radius:50%;background:var(--amber);display:inline-block"></span> Checking live Miami GIS…';
  if (LIVE.mode === "live")
    return '<span style="width:5px;height:5px;border-radius:50%;background:var(--good);display:inline-block;box-shadow:0 0 6px var(--good)"></span> Live Miami GIS · ' + LIVE.ok + '/' + SITES.length + ' parcels';
  return '<span style="width:5px;height:5px;border-radius:50%;background:var(--muted);display:inline-block"></span> Sample values · tap ↻ to load live';
}

// -------------------- HELPERS --------------------
const fmt$  = n => n == null ? "—" : "$" + Math.round(n).toLocaleString();
const fmt$k = n => n == null ? "—" : "$" + Math.round(n/1000).toLocaleString() + "K";
const fmt$m = n => n == null ? "—" : "$" + (n/1e6).toFixed(2) + "M";
const fmtNum = n => n == null ? "—" : Math.round(n).toLocaleString();
const fmtPct = n => n == null ? "—" : (n*100).toFixed(2) + "%";
const fmtSF = n => fmtNum(n) + " SF";
const acres = sf => (sf / 43560).toFixed(2);

function getPF(site) { return { ...site.proforma, ...(state.pfOverride[site.id] || {}) }; }
function computePF(site) {
  const pf = getPF(site);
  const buildableSF = pf.units * pf.avgUnitSF * 1.18;
  const hardCost = buildableSF * pf.hardCostSF;
  const softCost = hardCost * 0.22;
  const landCost = site.askPrice;
  const contingency = (hardCost + softCost) * 0.05;
  const tdc = landCost + hardCost + softCost + contingency;
  const costPerUnit = tdc / pf.units;
  const annualRentRestricted = pf.monthlyRentRestricted * pf.units * 12;
  const noi = annualRentRestricted * 0.58 - (pf.units * 250);
  const yieldOnCost = noi / tdc;
  const eligibleBasis = (hardCost + softCost + contingency) * 0.95;
  const basisBoost = (site.incentiveFlags.qct || site.incentiveFlags.dda) ? 1.30 : 1.0;
  const adjustedBasis = eligibleBasis * basisBoost;
  const lihtcRate = site.incentives.some(i => i.includes("9%")) ? 0.09 : 0.04;
  const annualCredits = adjustedBasis * lihtcRate;
  const tenYrCredits = annualCredits * 10;
  const lihtcEquity = tenYrCredits * 0.92;
  const debtCoverage = noi / 1.20 / 0.065;
  const permLoan = Math.min(debtCoverage, tdc * 0.55);
  const softLoans = tdc * 0.08;
  const gpEquity = Math.max(0, tdc - lihtcEquity - permLoan - softLoans);
  return {
    buildableSF, hardCost, softCost, landCost, contingency, tdc, costPerUnit,
    annualRentRestricted, noi, yieldOnCost,
    eligibleBasis, adjustedBasis, lihtcRate, annualCredits, tenYrCredits, lihtcEquity,
    permLoan, softLoans, gpEquity, basisBoost
  };
}
function filteredSites() {
  const q = state.query.trim().toLowerCase();
  return SITES.filter(s => {
    if (q) {
      const hay = [s.zip, s.city, s.state, s.county, s.addr, s.neighborhood].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    const f = state.filters;
    if (f.lihtc && !s.incentiveFlags.lihtc) return false;
    if (f.oz && !s.incentiveFlags.oz) return false;
    if (f.densityBonus && !s.incentiveFlags.densityBonus) return false;
    if (f.inclusionary && !s.incentiveFlags.inclusionary) return false;
    if (f.qct && !s.incentiveFlags.qct) return false;
    if (f.dda && !s.incentiveFlags.dda) return false;
    if (f.tod && !s.incentiveFlags.tod) return false;
    if (f.hudHome && !s.incentiveFlags.hudHome) return false;
    if (f.liveLocal && !s.incentiveFlags.liveLocal) return false;
    if (f.surtax && !s.incentiveFlags.surtax) return false;
    if (f.excludeFloodAE && s.incentiveFlags.floodAE) return false;
    if (s.askPrice > f.maxPrice) return false;
    if (s.lotSF < f.minLotSF) return false;
    if (f.constructionType !== "any") {
      const has = s.constructionTypes.some(c => c.toLowerCase().includes(f.constructionType.toLowerCase()));
      if (!has) return false;
    }
    return true;
  });
}

function setState(patch) { state = { ...state, ...patch }; render(); }
function setFilter(key, val) { state.filters = { ...state.filters, [key]: val }; render(); }
function setPF(siteId, key, val) {
  state.pfOverride[siteId] = { ...(state.pfOverride[siteId] || {}), [key]: val };
  render();
}
function resetPF(siteId) { delete state.pfOverride[siteId]; render(); }
function resetFilters() { state.filters = { ...DEFAULT_FILTERS }; state.query = ""; render(); }
function clearOneFilter(key) { state.filters[key] = DEFAULT_FILTERS[key]; render(); }

// -------------------- MAP (real, MapLibre GL) --------------------
let mapObj = null, mapNode = null, mapReady = false, popup = null, lastFlownId = null;

function sitesFC(sites) {
  return {
    type: "FeatureCollection",
    features: sites.filter(s => SITE_LATLNG[s.id]).map(s => {
      const ll = SITE_LATLNG[s.id];
      return {
        type: "Feature",
        id: s.id,
        geometry: { type: "Point", coordinates: [ll[1], ll[0]] },
        properties: {
          id: s.id,
          liveLocal: !!s.incentiveFlags.liveLocal,
          neighborhood: s.neighborhood, zip: s.zip, addr: s.addr,
          zoning: s.zoning.code, price: fmt$k(s.askPrice), ac: acres(s.lotSF),
        },
      };
    }),
  };
}

function initMap(node) {
  try {
    mapObj = new maplibregl.Map({
      container: node,
      style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
      center: [-80.21, 25.82],
      zoom: 10.3,
    });
    mapObj.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    mapObj.on("load", () => {
      mapObj.addSource("sites", { type: "geojson", data: sitesFC(filteredSites()) });
      mapObj.addLayer({
        id: "sites-glow", type: "circle", source: "sites",
        paint: {
          "circle-radius": 15,
          "circle-color": ["case", ["get", "liveLocal"], "#5eead4", "#818cf8"],
          "circle-opacity": 0.12,
        },
      });
      mapObj.addLayer({
        id: "sites-dots", type: "circle", source: "sites",
        paint: {
          "circle-radius": ["case", ["boolean", ["feature-state", "selected"], false], 9, 6.5],
          "circle-color": ["case",
            ["boolean", ["feature-state", "selected"], false], "#fb923c",
            ["get", "liveLocal"], "#5eead4", "#818cf8"],
          "circle-stroke-width": 2,
          "circle-stroke-color": "#070b16",
        },
      });
      mapObj.on("click", "sites-dots", (e) => {
        const f = e.features && e.features[0];
        if (f) setState({ selectedId: f.properties.id });
      });
      mapObj.on("mouseenter", "sites-dots", (e) => {
        mapObj.getCanvas().style.cursor = "pointer";
        const f = e.features && e.features[0]; if (!f) return;
        const p = f.properties;
        if (popup) popup.remove();
        popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12 })
          .setLngLat(e.lngLat)
          .setHTML('<div style="font-weight:600">' + p.neighborhood + ' · ' + p.zip + '</div>' +
                   '<div style="color:var(--muted)">' + p.addr + '</div>' +
                   '<div style="margin-top:3px"><span style="color:var(--teal)">' + p.zoning + '</span> · ' + p.price + ' · ' + p.ac + ' ac</div>')
          .addTo(mapObj);
      });
      mapObj.on("mouseleave", "sites-dots", () => {
        mapObj.getCanvas().style.cursor = "";
        if (popup) { popup.remove(); popup = null; }
      });
      mapReady = true;
      updateMapData(filteredSites());
      updateMapSelection();
    });
  } catch (e) {
    mapObj = null; mapReady = false;
    const slot = document.getElementById("map-slot");
    if (slot) slot.innerHTML = svgMapInner(filteredSites());
  }
}

function updateMapData(sites) {
  if (!mapReady || !mapObj) return;
  const src = mapObj.getSource("sites");
  if (src) src.setData(sitesFC(sites));
}

function updateMapSelection() {
  if (!mapReady || !mapObj) return;
  for (const s of SITES) {
    try { mapObj.setFeatureState({ source: "sites", id: s.id }, { selected: false }); } catch (e) {}
  }
  if (state.selectedId) {
    try { mapObj.setFeatureState({ source: "sites", id: state.selectedId }, { selected: true }); } catch (e) {}
    if (state.selectedId !== lastFlownId) {
      const ll = SITE_LATLNG[state.selectedId];
      if (ll) mapObj.flyTo({ center: [ll[1], ll[0]], zoom: 13.2, speed: 0.8 });
      lastFlownId = state.selectedId;
    }
  } else {
    lastFlownId = null;
  }
}

// Re-attach the persistent map node into the freshly-rendered slot (or fall back).
function mountMap(sites) {
  const slot = document.getElementById("map-slot");
  if (!slot) return;
  if (window.maplibregl) {
    if (!mapNode) {
      mapNode = document.createElement("div");
      mapNode.style.cssText = "width:100%;height:100%";
      slot.appendChild(mapNode);
      initMap(mapNode);
    } else {
      slot.appendChild(mapNode);
      if (mapObj) mapObj.resize();
    }
    updateMapData(sites);
    updateMapSelection();
  } else {
    slot.innerHTML = svgMapInner(sites);
  }
}

const FILTER_LABELS = {
  lihtc: "LIHTC", qct: "QCT", dda: "DDA", oz: "OZ",
  densityBonus: "Density Bonus", inclusionary: "Inclusionary",
  tod: "TOD", hudHome: "HUD HOME",
  liveLocal: "Live Local Act", surtax: "Miami-Dade Surtax", excludeFloodAE: "No Flood AE",
};
function ActiveFilters() {
  const f = state.filters;
  const chips = [];
  for (const k of Object.keys(FILTER_LABELS)) {
    if (f[k]) chips.push(`<span class="filter-chip">${FILTER_LABELS[k]} <button onclick="clearOneFilter('${k}')">×</button></span>`);
  }
  if (f.maxPrice < DEFAULT_FILTERS.maxPrice) chips.push(`<span class="filter-chip">≤ ${fmt$m(f.maxPrice)} <button onclick="clearOneFilter('maxPrice')">×</button></span>`);
  if (f.minLotSF > 0) chips.push(`<span class="filter-chip">≥ ${acres(f.minLotSF)} ac <button onclick="clearOneFilter('minLotSF')">×</button></span>`);
  if (f.constructionType !== "any") chips.push(`<span class="filter-chip">${f.constructionType} <button onclick="clearOneFilter('constructionType')">×</button></span>`);
  if (state.query) chips.push(`<span class="filter-chip">"${state.query.replace(/"/g, '&quot;')}" <button onclick="setState({query:''})">×</button></span>`);
  if (chips.length === 0) return "";
  return `
    <div class="flex flex-wrap items-center gap-2 fade-in">
      <span class="label-eyebrow" style="font-size:10px">Active</span>
      ${chips.join("")}
      <button class="btn-ghost text-[11px] !py-1 !px-2.5" onclick="resetFilters()">Clear all</button>
    </div>
  `;
}

function badges(s) {
  const flags = s.incentiveFlags;
  const out = [];
  if (flags.lihtc)        out.push(`<span class="chip chip-teal">LIHTC</span>`);
  if (flags.qct)          out.push(`<span class="chip chip-good">QCT</span>`);
  if (flags.dda)          out.push(`<span class="chip chip-good">DDA</span>`);
  if (flags.oz)           out.push(`<span class="chip chip-indigo">OZ</span>`);
  if (flags.liveLocal)    out.push(`<span class="chip chip-amber">Live Local</span>`);
  if (flags.densityBonus) out.push(`<span class="chip">+ Density</span>`);
  if (flags.tod)          out.push(`<span class="chip">TOD</span>`);
  if (flags.inclusionary) out.push(`<span class="chip">IZ</span>`);
  if (flags.surtax)       out.push(`<span class="chip">Surtax</span>`);
  if (flags.floodAE)      out.push(`<span class="chip chip-warn">${ICON.warn} Flood AE</span>`);
  return out.join("");
}

function siteCard(s) {
  const pf = computePF(s);

// -------------------- CHARTS --------------------
function donut(slices, centerLabel, centerValue) {
  const total = slices.reduce((a, s) => a + s.value, 0) || 1;
  const R = 60, r = 42, cx = 80, cy = 80;
  let acc = 0;
  const segs = slices.map(s => {
    const startAngle = (acc / total) * Math.PI * 2 - Math.PI/2;
    acc += s.value;
    const endAngle = (acc / total) * Math.PI * 2 - Math.PI/2;
    const large = (endAngle - startAngle) > Math.PI ? 1 : 0;
    const x1 = cx + R * Math.cos(startAngle), y1 = cy + R * Math.sin(startAngle);
    const x2 = cx + R * Math.cos(endAngle),   y2 = cy + R * Math.sin(endAngle);
    const x3 = cx + r * Math.cos(endAngle),   y3 = cy + r * Math.sin(endAngle);
    const x4 = cx + r * Math.cos(startAngle), y4 = cy + r * Math.sin(startAngle);
    return `<path d="M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${r} ${r} 0 ${large} 0 ${x4} ${y4} Z" fill="${s.color}" stroke="var(--panel-2)" stroke-width="1.5"/>`;
  }).join("");
  return `
    <svg viewBox="0 0 160 160" width="160" height="160">
      ${segs}
      <text x="80" y="76" text-anchor="middle" fill="var(--muted)" font-size="9.5" letter-spacing="0.08em" font-family="Space Grotesk">${centerLabel}</text>
      <text x="80" y="96" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="700" font-family="Space Grotesk">${centerValue}</text>
    </svg>
  `;
}

function gauge(value, label) {
  const max = 0.10;
  const pct = Math.max(0, Math.min(1, value / max));
  const angle = pct * Math.PI;
  const R = 60, cx = 80, cy = 90;
  const x = cx - R * Math.cos(angle);
  const y = cy - R * Math.sin(angle);
  const large = 0;
  const arcPath = `M ${cx-R} ${cy} A ${R} ${R} 0 ${large} 1 ${x} ${y}`;
  const trackPath = `M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy}`;
  const color = value >= 0.06 ? "#34d399" : value >= 0.045 ? "#fbbf24" : "#f87171";
  const ticks = [0.04, 0.06, 0.08].map(t => {
    const a = (t / max) * Math.PI;
    const tx1 = cx - R * Math.cos(a), ty1 = cy - R * Math.sin(a);
    const tx2 = cx - (R+5) * Math.cos(a), ty2 = cy - (R+5) * Math.sin(a);
    const lblX = cx - (R+13) * Math.cos(a), lblY = cy - (R+13) * Math.sin(a);
    return `
      <line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="var(--muted)" stroke-width="1"/>
      <text x="${lblX}" y="${lblY+3}" text-anchor="middle" fill="var(--muted)" font-size="8">${(t*100).toFixed(0)}%</text>
    `;
  }).join("");
  return `
    <svg viewBox="0 0 160 110" width="160" height="110">
      <path d="${trackPath}" class="gauge-track"/>
      <path d="${arcPath}" stroke="${color}" fill="none" stroke-width="10" stroke-linecap="round"/>
      ${ticks}
      <text x="80" y="78" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="700" font-family="Space Grotesk">${fmtPct(value)}</text>
      <text x="80" y="92" text-anchor="middle" fill="var(--muted)" font-size="9" letter-spacing="0.08em">${label}</text>
    </svg>
  `;
}

function stackedBar(items, total) {
  return `
    <div class="bar" style="height:14px">
      ${items.map(i => {
        const pct = (i.value/total)*100;
        return `<span style="width:${pct}%;background:${i.color}"></span>`;
      }).join("")}
    </div>
    <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-[11px]">
      ${items.map(i => `
        <span class="inline-flex items-center gap-1.5" style="color:var(--text-2)">
          <span style="width:8px;height:8px;border-radius:2px;background:${i.color};display:inline-block"></span>
          ${i.label} · <span class="num" style="color:var(--muted)">${fmt$k(i.value)}</span>
        </span>
      `).join("")}
    </div>
  `;
}

              Sketch-level — confirm against state QAP (FL FHFC), local fee schedules, and current GC pricing.
            </div>
          </div>
        </section>
      </div>
    </div>
  `;
}

      <p>Before adding accounts, a waitlist, payments, or analytics, this policy will be expanded to cover what we collect and your rights, including CCPA/CPRA and GDPR where applicable.</p>
      <p class="muted">Last updated: May 2026. Contact: abhinav.akhouri@gmail.com</p>
    `,
  },
};
function Modal() {
  if (!state.modal || !DOC[state.modal]) return "";
  const d = DOC[state.modal];
  return `
    <div class="pp-modal-overlay" onclick="if(event.target===this)closeDoc()">
      <div class="pp-modal">
        <div class="pp-modal-head">
          <div class="font-display" style="font-weight:700;color:var(--text);font-size:15px">${d.title}</div>
          <div class="pp-x" onclick="closeDoc()">${ICON.close}</div>
        </div>
        <div class="pp-modal-body">${d.html}</div>
      </div>
    </div>
  `;
}
function openDoc(k) { setState({ modal: k }); }
function closeDoc() { setState({ modal: null }); }

function render() {
  const sites = filteredSites();
  const selected = SITES.find(s => s.id === state.selectedId) || null;
  const activeFiltersHtml = ActiveFilters();
  // Preserve the live MapLibre node across full re-renders (re-attached after).
  if (mapNode && mapNode.parentNode) mapNode.parentNode.removeChild(mapNode);
  document.getElementById("app").innerHTML = `
    ${Header()}
    <main class="max-w-[1400px] mx-auto px-6 py-5">
      <div class="grid grid-cols-12 gap-4">
        <div class="col-span-12 lg:col-span-3">${Sidebar()}</div>
        <div class="col-span-12 lg:col-span-9 space-y-4">
          ${MiamiMap(sites)}
          ${activeFiltersHtml}
          ${selected ? Detail(selected) : ''}
          ${selected ? `<div class="flex items-center gap-3 mt-2"><div class="divider flex-1"></div><div class="text-[11px]" style="color:var(--muted)">Other matches</div><div class="divider flex-1"></div></div>` : ''}
          ${Results(sites)}
        </div>
      </div>
    </main>
    <footer class="max-w-[1400px] mx-auto px-6 py-8 text-[11px] leading-relaxed" style="color:var(--muted)">
      <span style="color:var(--text-2);font-weight:600">ParcelPath</span> · v0.3.1 · Phase 0 · Representative Miami-Dade parcels at real coordinates.
      <strong style="color:var(--text-2)">Zoning</strong> (transect, height, FAR) is pulled live from the City of Miami Miami&nbsp;21 GIS, and
      <strong style="color:var(--text-2)">flood zone</strong> from FEMA's National Flood Hazard Layer, queried at each parcel's location.
      Incentive designations (QCT/DDA/OZ/Live Local) are tagged by neighborhood; rents and construction costs are estimates.
      If live GIS can't be reached (e.g. opened from a file:// path in some browsers), the app shows sample values — host it, or use the ↻ button to retry.
      Pro-forma is sketch-level — first-pass screening only.
      <div style="margin-top:10px">
        <a class="pp-link" onclick="openDoc('disclaimer')">Disclaimer</a>
        <span style="color:var(--border)">&nbsp;·&nbsp;</span>
        <a class="pp-link" onclick="openDoc('privacy')">Privacy</a>
      </div>
    </footer>
    ${Modal()}
  `;
  mountMap(filteredSites());
}

window.setState = setState;
window.setFilter = setFilter;
window.setPF = setPF;
window.resetPF = resetPF;
window.resetFilters = resetFilters;

window.enrichFromLiveGIS = enrichFromLiveGIS;
window.openDoc = openDoc;
window.closeDoc = closeDoc;

render();
// Pull real zoning + flood data from public Miami / FEMA GIS for each parcel.
enrichFromLiveGIS();
</script>
